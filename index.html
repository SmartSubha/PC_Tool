    <meta property="og:type" content="website" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pctool_theme');
          var dark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f8fafc] dark:bg-slate-950 text-[#1e293b] dark:text-slate-100 antialiased transition-colors duration-150">

  </body>
